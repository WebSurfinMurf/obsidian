version: '3.8'

services:
  obsidian:
    container_name: obsidian
    image: lscr.io/linuxserver/obsidian:latest
    restart: unless-stopped
    env_file:
      - /home/administrator/secrets/obsidian.env
    networks:
      - obsidian-net
      - traefik-net
    ports:
      - "3000:3000"
    volumes:
      - /home/administrator/projects/data/obsidian:/config
    # PUID, PGID, TZ loaded from env_file
    shm_size: "1gb"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  obsidian-auth-proxy:
    container_name: obsidian-auth-proxy
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    restart: unless-stopped
    env_file:
      - /home/administrator/secrets/obsidian.env
    networks:
      - obsidian-net
      - keycloak-net
      - traefik-net
    environment:
      - OAUTH2_PROXY_PROVIDER=keycloak-oidc
      - OAUTH2_PROXY_CLIENT_ID=obsidian
      # OAUTH2_PROXY_CLIENT_SECRET and OAUTH2_PROXY_COOKIE_SECRET loaded from env_file
      - OAUTH2_PROXY_COOKIE_NAME=_obsidian_oauth2_proxy
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://keycloak.ai-servicers.com/realms/master
      - OAUTH2_PROXY_LOGIN_URL=https://keycloak.ai-servicers.com/realms/master/protocol/openid-connect/auth
      - OAUTH2_PROXY_REDEEM_URL=http://keycloak:8080/realms/master/protocol/openid-connect/token
      - OAUTH2_PROXY_OIDC_JWKS_URL=http://keycloak:8080/realms/master/protocol/openid-connect/certs
      - OAUTH2_PROXY_SKIP_OIDC_DISCOVERY=true
      - OAUTH2_PROXY_REDIRECT_URL=https://obsidian.ai-servicers.com/oauth2/callback
      - OAUTH2_PROXY_ALLOWED_GROUPS=/developers,/administrators
      - OAUTH2_PROXY_UPSTREAMS=http://obsidian:3000
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_HTTPONLY=true
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
      - OAUTH2_PROXY_PASS_ACCESS_TOKEN=true
      - OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER=true
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
    labels:
      # External access with OAuth2 authentication
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.obsidian.rule=Host(`obsidian.ai-servicers.com`)"
      - "traefik.http.routers.obsidian.entrypoints=websecure"
      - "traefik.http.routers.obsidian.tls=true"
      - "traefik.http.routers.obsidian.tls.certresolver=letsencrypt"
      - "traefik.http.services.obsidian.loadbalancer.server.port=4180"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  obsidian-net:
  keycloak-net:
    external: true
  traefik-net:
    external: true
